<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e0d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="加倉計算">
  <meta name="description" content="計算加倉每注金額同預留總額">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>加倉計算</title>
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <rect x="5" y="5" width="6" height="3.2" rx="1.6" fill="#5aa8a0"/>
            <rect x="5" y="10.4" width="10" height="3.2" rx="1.6" fill="#4ec4b8"/>
            <rect x="5" y="15.8" width="14" height="3.2" rx="1.6" fill="#3ecfbf"/>
            <rect x="5" y="21.2" width="18" height="3.2" rx="1.6" fill="#7ee8d8"/>
            <rect x="6.1" y="4.2" width="1.6" height="23.4" rx=".8" fill="#3ecfbf"/>
          </svg>
        </span>
        <div>
          <h1>加倉計算</h1>
          <p class="lede">計每注金額同預留總額</p>
        </div>
      </div>
      <button type="button" class="text-btn" id="resetBtn">重設</button>
    </header>

    <form id="form" class="panel" autocomplete="off">
      <div class="field">
        <label for="first">第一注金額</label>
        <div class="control">
          <input id="first" name="first" type="text" inputmode="decimal" enterkeyhint="done" spellcheck="false" value="15">
          <span class="unit">U</span>
        </div>
      </div>

      <div class="field">
        <label for="multiplier">倍數</label>
        <div class="control">
          <input id="multiplier" name="multiplier" type="text" inputmode="decimal" enterkeyhint="done" spellcheck="false" value="2">
        </div>
        <div class="chips" id="multChips" role="group" aria-label="常用倍數">
          <button type="button" data-m="1">1</button>
          <button type="button" data-m="1.5">1.5</button>
          <button type="button" class="on" data-m="2">2</button>
          <button type="button" data-m="3">3</button>
        </div>
      </div>

      <div class="field">
        <label for="levels">總注數</label>
        <div class="control stepper">
          <button type="button" id="levelsDown" aria-label="減少注數">−</button>
          <input id="levels" name="levels" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" spellcheck="false" value="5">
          <button type="button" id="levelsUp" aria-label="增加注數">+</button>
        </div>
        <p class="hint" id="addsHint">加倉次數 = 總注數 − 1，而家係 4 次</p>
      </div>

      <div class="optional">
        <p class="opt-label">可選 · 唔填就只計金額</p>

        <div class="grid-2">
          <div class="field">
            <label for="stepPct">每級價格間隔</label>
            <div class="control">
              <input id="stepPct" name="stepPct" type="text" inputmode="decimal" enterkeyhint="done" spellcheck="false" placeholder="例如 2">
              <span class="unit">%</span>
            </div>
          </div>
          <div class="field">
            <label for="budget">手上最多用幾多</label>
            <div class="control">
              <input id="budget" name="budget" type="text" inputmode="decimal" enterkeyhint="done" spellcheck="false" placeholder="唔限">
              <span class="unit">U</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="startPrice">第一注價格</label>
          <div class="control">
            <input id="startPrice" name="startPrice" type="text" inputmode="decimal" enterkeyhint="done" spellcheck="false" placeholder="可手填，或下面取價">
          </div>
        </div>

        <div class="field">
          <label for="symbol">幣種（Binance 公開價）</label>
          <div class="control fetch-row">
            <input id="symbol" name="symbol" type="text" enterkeyhint="done" spellcheck="false" autocapitalize="characters" placeholder="例如 BTC 或 XAUT">
            <button type="button" class="fetch-btn" id="fetchBtn">取價</button>
          </div>
          <p class="hint" id="fetchStatus" role="status"></p>
        </div>
      </div>
    </form>

    <section class="summary" id="summary" aria-live="polite"></section>
    <p class="error" id="formError" hidden></p>

    <section class="panel chart-wrap" id="chartPanel" hidden>
      <div class="panel-head">
        <h2>價格階梯</h2>
        <p class="hint" id="chartNote"></p>
      </div>
      <div class="chart-scroll" id="chartScroll"></div>
    </section>

    <section class="panel table-wrap" id="tablePanel">
      <div class="table-scroll">
        <table id="table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <p class="footnote">呢個只係金額同價格嘅算術，唔構成交易建議。</p>
  </div>
  <script src="app.js?v=1"></script>
</body>
</html>
